# OpenOCD config: Hazard3 debug via the Colorlight i5 extension board's
# CMSIS-DAP probe, tunnelled through the ECP5 chip TAP (JTAGG ER1/ER2).
# Based on hazard3/example_soc/ulx3s-openocd.cfg.

adapter driver cmsis-dap
transport select jtag
adapter speed 5000

# LFE5U-25F IDCODE
jtag newtap lfe5u25 hazard3 -expected-id 0x41111043 -irlen 8 -irmask 0xFF -ircapture 0x5

target create lfe5u25.hazard3 riscv -chain-position lfe5u25.hazard3
riscv set_ir dtmcs 0x32
riscv set_ir dmi 0x38

gdb_report_data_abort enable
init
halt
